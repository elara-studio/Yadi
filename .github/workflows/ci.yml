name: CI

# Checks run on every push and pull request. Installers are built on every run and kept as
# workflow artifacts (they are unsigned: see docs/RELEASE.md for signing and notarisation).

on:
  push:
  pull_request:

jobs:
  check:
    name: Check and build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifact: yadi-macos-aarch64
            bundle_glob: app/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows (x64)
            os: windows-latest
            artifact: yadi-windows-x64
            bundle_glob: app/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: pnpm install --frozen-lockfile
      # Generates the licence data and THIRD_PARTY_NOTICES.txt, then checks them. --release also
      # fails on any licence that is still UNVERIFIED, so it cannot be skipped by accident.
      - run: node scripts/gen-licenses.mjs
      - run: node scripts/check-licenses.mjs --release
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the installer
        run: pnpm --filter app tauri build
      - name: The installer must carry the real notices, not the stand-in
        shell: bash
        run: |
          if grep -q "^STAND-IN" app/src-tauri/resources/THIRD_PARTY_NOTICES.txt; then
            echo "THIRD_PARTY_NOTICES.txt is the stand-in" && exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error
